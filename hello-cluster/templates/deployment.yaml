apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.deployment.spec.replicas }} 
  selector:
    matchLabels:
      app: {{ .Release.Name }} 
  template:
    metadata:
      labels:
        app: {{ .Release.Name }} 
spec:
  revisionHistoryLimit: 1
  template:
    spec:
      containers:
      - name: {{ .Release.Name }} 
        image: {{ .Values.image }}:{{ .Values.version | default "0" }}
        ports:
        - containerPort: 80
        livenessProbe:
          httpGet:
            path: /health
            port: 80
        imagePullPolicy: Always
        securityContext:
          readOnlyRootFilesystem: false
        resources:
          requests:
            cpu: "1.0"
            memory: "1G"
          limits:
            cpu: "1.0"
            memory: "1G"
        env:  
        - name: ENVIRONMENT
          value: {{ .Values.environment }}-force-change
        - name: SHA
          value: {{ .Values.sha }}
        - name: DEVOPS-SECRET
          value: "devops-test-key@azurekeyvault"
