apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.deployment.spec.replicas }} 
  selector:
    matchLabels:
      app: {{ .Release.Name }} 
  revisionHistoryLimit: 1
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
      - name: {{ .Release.Name }} 
        image: {{ .Values.image }}:{{ .Values.version | default "0" }}
        ports:
        - containerPort: 80
        livenessProbe:
          httpGet:
            path: /health
            port: 80
        imagePullPolicy: Always
        env:  
        - name: ENVIRONMENT
          value: {{ .Values.environment }}
