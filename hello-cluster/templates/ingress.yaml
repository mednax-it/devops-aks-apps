apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello-ingress
  annotations:
    kubernetes.io/ingress.class: azure/application-gateway
    {{- if .Values.aa }}
    appgw.ingress.kubernetes.io/appgw-ssl-certificate: "pdx-platforms"
    {{- else }}
    cert-manager.io/cluster-issuer: letsencrypt-prod 
    {{- end }}
spec:
  rules:
    - host: hello.{{ .Values.url }}
      http:
        paths:
          - backend:
              service:
                name: {{ .Release.Name }}
                port:
                  number: 80
            path: /*
            pathType: Prefix
  {{- if not .Values.aa }}
  tls:
    - hosts:
        - hello.{{ .Values.url }}
      secretName: hello-secret
  {{- end }}
